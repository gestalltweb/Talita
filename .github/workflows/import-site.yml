name: Import tested Talita website
on:
  push:
    paths:
      - .github/workflows/import-site.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-talita-site
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified website archive
        shell: bash
        run: |
          set -euo pipefail
          if test -f package.json; then
            echo "Site already imported. Nothing to change."
            exit 0
          fi
          curl --fail --location --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JSJ6GV87lzmsrrO2wRrDO0czdK/5115d65a-7661-4519-8fe0-f1ca5ee2f4a2.zip' --output /tmp/talita-source.zip
          echo 'f55c474e686b543ab1dba4155c62b1c3bca4af595b2efab3a2574d2cd4b6f089  /tmp/talita-source.zip' | sha256sum --check
          unzip -q /tmp/talita-source.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import Talita Vieira website ready for Vercel"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
